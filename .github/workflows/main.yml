name: Flutter CI

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # ✅ Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0' # or whatever version you are using

      # Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # Check formatting
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # Analyze code
      - name: Analyze code
        run: flutter analyze .
