name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v3

      # Step 2: Setup Java
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # Step 3: Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      # Step 4: Get Flutter packages
      - name: Get dependencies
        run: flutter pub get

      # Step 5: Check for any formatting issues
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # Step 6: Statically analyze the Dart code
      - name: Analyze code
        run: flutter analyze .

      # Step 7: Run Flutter tests
      - name: Run tests
        run: flutter test

      # Step 8: Build APK
      - name: Build APK
        run: flutter build apk --release

      # Step 9: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
